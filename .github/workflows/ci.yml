name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run ruff check app
      - run: uv run ruff format --check app
      - run: uv run mypy app
      - run: uv run pytest -q

  api-migrations:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: notely
          POSTGRES_PASSWORD: notely
          POSTGRES_DB: notely
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U notely" --health-interval 5s --health-timeout 3s --health-retries 20
    defaults:
      run:
        working-directory: apps/api
    env:
      DATABASE_URL: postgresql+asyncpg://notely:notely@localhost:5432/notely
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --frozen
      - run: uv run alembic upgrade head
      - run: uv run alembic check
      - run: uv run alembic downgrade base && uv run alembic upgrade head

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter web typecheck
      - run: pnpm --filter web lint
      - run: pnpm --filter web test
      - run: pnpm --filter web build
        env:
          API_INTERNAL_URL: http://localhost:8000

  e2e:
    runs-on: ubuntu-latest
    needs: [api, web]
    steps:
      - uses: actions/checkout@v4
      - run: cp .env.example .env
      - run: docker compose up -d --build --wait postgres redis migrate api web
        env:
          RATE_LIMIT_AUTH_PER_MINUTE: "500"
          AI_PROVIDER: fake
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter web exec playwright install --with-deps chromium
      - uses: astral-sh/setup-uv@v5
      - run: cd apps/api && uv sync --frozen && (uv run python scripts/demo_mcp_server.py --port 8765 --token demo-token &)
      - run: pnpm --filter web test:e2e
        env:
          CI: "true"
      - if: failure()
        run: docker compose logs api web
