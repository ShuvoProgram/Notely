[project]
name = "notely-api"
version = "0.1.0"
description = "Notely AI application API"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "sqlalchemy[asyncio]>=2.0.32",
  "alembic>=1.13",
  "asyncpg>=0.29",
  "psycopg[binary]>=3.2",
  "redis>=5.0",
  "arq>=0.26",
  "httpx>=0.27",
  "pyjwt[crypto]>=2.9",
  "cryptography>=43",
  "pwdlib[argon2]>=0.2",
  "email-validator>=2.2",
  "python-json-logger>=2.0",
  "pgvector>=0.3",
  "openai>=1.50",
  "langgraph>=0.4",
  "langgraph-checkpoint-postgres>=2.0",
  "langchain-core>=0.3",
  "langchain-openai>=0.3",
  "psycopg-pool>=3.2",
  "mcp>=1.10",
  "jsonschema>=4.23",
  "prometheus-client>=0.20",
  "langchain-anthropic>=0.3",
  "langchain-google-genai>=2.1",
  "qrcode[pil]>=8.0",
]

[dependency-groups]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "pytest-cov>=5",
  "aiosqlite>=0.20",
  "ruff>=0.6",
  "mypy>=1.11",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
testpaths = ["app/tests"]
markers = ["eval: agent behaviour evals against a live model (opt in with AI_EVAL=1)"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC"]

[tool.ruff.lint.isort]
known-third-party = ["alembic"]

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
strict = true
ignore_missing_imports = true
warn_return_any = false

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
