# Edge for Notely: TLS termination, static caching hints, SSE-safe proxying.
# Mount certificates at /etc/nginx/certs/{fullchain.pem,privkey.pem} (or terminate TLS at a CDN
# in front of this and keep only the :80 server).

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

upstream notely_web { server web:3000; }
upstream notely_api { server api:8000; }

server {
    listen 80;
    server_name _;
    location /health/live { proxy_pass http://notely_api/health/live; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache   shared:notely:10m;

    client_max_body_size 4m;
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header Upgrade           $http_upgrade;
    proxy_set_header Connection        $connection_upgrade;

    # API + health straight to FastAPI. SSE streams must not be buffered.
    location ~ ^/(api|health|metrics)(/|$) {
        proxy_pass http://notely_api;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 600s;
        gzip off;
    }

    # Hashed Next.js assets are immutable.
    location /_next/static/ {
        proxy_pass http://notely_web;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        proxy_pass http://notely_web;
        gzip on;
        gzip_types text/plain text/css application/json application/javascript image/svg+xml;
    }
}
