# LiteLLM gateway configuration. Model aliases are what the application requests;
# provider keys come from the environment. Add or swap providers here, never in app code.
model_list:
  - model_name: notely-default
    litellm_params:
      model: anthropic/claude-sonnet-5
      api_key: os.environ/ANTHROPIC_API_KEY
  - model_name: notely-fast
    litellm_params:
      model: anthropic/claude-haiku-4-5-20251001
      api_key: os.environ/ANTHROPIC_API_KEY
  - model_name: notely-openai
    litellm_params:
      model: openai/gpt-4o
      api_key: os.environ/OPENAI_API_KEY
  - model_name: notely-embed
    litellm_params:
      model: openai/text-embedding-3-small
      api_key: os.environ/OPENAI_API_KEY

router_settings:
  routing_strategy: simple-shuffle
  num_retries: 2
  fallbacks:
    - notely-default: ["notely-openai"]

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
