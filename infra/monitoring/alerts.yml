# Starter alert rules (Prometheus). Tune thresholds to your traffic.
groups:
  - name: notely
    rules:
      - alert: NotelyHighErrorRate
        expr: |
          sum(rate(notely_http_errors_total[5m])) / sum(rate(notely_http_requests_total[5m])) > 0.02
        for: 10m
        labels: { severity: page }
        annotations: { summary: "More than 2% of API requests are failing" }
      - alert: NotelySlowRequests
        expr: histogram_quantile(0.95, sum(rate(notely_http_request_seconds_bucket[5m])) by (le)) > 1.5
        for: 15m
        labels: { severity: warn }
        annotations: { summary: "p95 API latency above 1.5s" }
      - alert: NotelyQueueBacklog
        expr: notely_queue_depth > 500
        for: 10m
        labels: { severity: warn }
        annotations: { summary: "Background queue is backing up" }
      - alert: NotelyJobFailures
        expr: sum(increase(notely_jobs_total{status="failed"}[30m])) > 10
        labels: { severity: warn }
        annotations: { summary: "Background jobs are failing" }
      - alert: NotelyAIFailures
        expr: |
          sum(rate(notely_ai_runs_total{status="failed"}[15m])) / sum(rate(notely_ai_runs_total[15m])) > 0.1
        for: 15m
        labels: { severity: page }
        annotations: { summary: "More than 10% of agent runs are failing" }
      - alert: NotelyProviderAuthFailures
        expr: sum(increase(notely_provider_errors_total{kind=~"expired|auth_failed"}[1h])) by (provider) > 20
        labels: { severity: warn }
        annotations: { summary: "Many connections to {{ $labels.provider }} are losing authorization" }
