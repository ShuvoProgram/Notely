name: notely

x-api-env: &api-env
  ENVIRONMENT: ${ENVIRONMENT:-development}
  DATABASE_URL: postgresql+asyncpg://notely:${POSTGRES_PASSWORD:-notely}@postgres:5432/notely
  REDIS_URL: redis://redis:6379/0
  SESSION_SECRET: ${SESSION_SECRET:-dev-only-session-secret-change-me}
  ENCRYPTION_KEY: ${ENCRYPTION_KEY:-}
  FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-http://localhost:3000}
  ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:3000}
  API_PUBLIC_URL: ${API_PUBLIC_URL:-http://localhost:8000}
  LITELLM_API_BASE: http://litellm:4000
  LITELLM_API_KEY: ${LITELLM_MASTER_KEY:-sk-notely-dev}
  OAUTH_GOOGLE_CLIENT_ID: ${OAUTH_GOOGLE_CLIENT_ID:-}
  OAUTH_GOOGLE_CLIENT_SECRET: ${OAUTH_GOOGLE_CLIENT_SECRET:-}
  OAUTH_MICROSOFT_CLIENT_ID: ${OAUTH_MICROSOFT_CLIENT_ID:-}
  OAUTH_MICROSOFT_CLIENT_SECRET: ${OAUTH_MICROSOFT_CLIENT_SECRET:-}
  OAUTH_MICROSOFT_TENANT: ${OAUTH_MICROSOFT_TENANT:-common}
  OAUTH_SLACK_CLIENT_ID: ${OAUTH_SLACK_CLIENT_ID:-}
  OAUTH_SLACK_CLIENT_SECRET: ${OAUTH_SLACK_CLIENT_SECRET:-}
  OAUTH_NOTION_CLIENT_ID: ${OAUTH_NOTION_CLIENT_ID:-}
  OAUTH_NOTION_CLIENT_SECRET: ${OAUTH_NOTION_CLIENT_SECRET:-}
  OAUTH_TODOIST_CLIENT_ID: ${OAUTH_TODOIST_CLIENT_ID:-}
  OAUTH_TODOIST_CLIENT_SECRET: ${OAUTH_TODOIST_CLIENT_SECRET:-}
  OAUTH_ASANA_CLIENT_ID: ${OAUTH_ASANA_CLIENT_ID:-}
  OAUTH_ASANA_CLIENT_SECRET: ${OAUTH_ASANA_CLIENT_SECRET:-}
  OAUTH_JIRA_CLIENT_ID: ${OAUTH_JIRA_CLIENT_ID:-}
  OAUTH_JIRA_CLIENT_SECRET: ${OAUTH_JIRA_CLIENT_SECRET:-}
  OAUTH_DROPBOX_CLIENT_ID: ${OAUTH_DROPBOX_CLIENT_ID:-}
  OAUTH_DROPBOX_CLIENT_SECRET: ${OAUTH_DROPBOX_CLIENT_SECRET:-}
  OAUTH_CLICKUP_CLIENT_ID: ${OAUTH_CLICKUP_CLIENT_ID:-}
  OAUTH_CLICKUP_CLIENT_SECRET: ${OAUTH_CLICKUP_CLIENT_SECRET:-}
  RATE_LIMIT_AUTH_PER_MINUTE: ${RATE_LIMIT_AUTH_PER_MINUTE:-10}
  AI_PROVIDER: ${AI_PROVIDER:-litellm}
  AI_CHECKPOINTER: postgres
  METRICS_TOKEN: ${METRICS_TOKEN:-}
  TRUST_PROXY_HEADERS: ${TRUST_PROXY_HEADERS:-false}
  LOG_LEVEL: ${LOG_LEVEL:-INFO}

services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: notely
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-notely}
      POSTGRES_DB: notely
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U notely -d notely"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  migrate:
    build:
      context: .
      dockerfile: infra/docker/api.Dockerfile
    environment: *api-env
    command: ["alembic", "upgrade", "head"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    build:
      context: .
      dockerfile: infra/docker/api.Dockerfile
    environment: *api-env
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: infra/docker/api.Dockerfile
    environment: *api-env
    command: ["arq", "app.workers.main.WorkerSettings"]
    healthcheck:
      test: ["CMD", "arq", "--check", "app.workers.main.WorkerSettings"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: infra/docker/web.Dockerfile
      args:
        API_INTERNAL_URL: http://api:8000
        WEB_SECURE: ${WEB_SECURE:-false}
    environment:
      API_INTERNAL_URL: http://api:8000
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/health"]
      interval: 15s
      timeout: 3s
      retries: 5
      start_period: 15s
    ports:
      - "${WEB_PORT:-3000}:3000"
    depends_on:
      - api
    restart: unless-stopped

  litellm:
    image: ghcr.io/berriai/litellm:main-stable
    command: ["--config", "/etc/litellm/config.yaml", "--port", "4000"]
    environment:
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:-sk-notely-dev}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
    volumes:
      - ./infra/litellm/config.yaml:/etc/litellm/config.yaml:ro
    ports:
      - "${LITELLM_PORT:-4000}:4000"
    restart: unless-stopped

volumes:
  postgres-data:
  redis-data:
